[package]
name = "fpv_sim"
version = "0.1.0"
edition = "2021"
description = "Fast quadcopter racing simulator for reinforcement learning, with Python bindings"
license = "MIT"

[lib]
name = "fpv_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
